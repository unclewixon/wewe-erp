# WEWE ERP — DigitalOcean droplet stack (HTTP on the droplet IP).
# One command:  docker compose up -d --build
# See docs/DIGITALOCEAN.md for the full runbook.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-wewe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-wewe_erp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wewe}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://${DB_USER:-wewe}:${DB_PASSWORD}@db:5432/${DB_NAME:-wewe_erp}
      PORT: 3001
      COOKIE_SECURE: ${COOKIE_SECURE:-0}   # 0 for plain-HTTP droplet-IP trial; set 1 behind HTTPS
      CORS_ORIGIN: ${WEB_ORIGIN:-}
      SEED_DEMO: ${SEED_DEMO:-1}           # seed the demo org on first boot (empty DB only)
      # Email (SMTP) — unset SMTP_HOST keeps the dev .eml file outbox
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # QuickBooks Online (live) — unset credentials keep sandbox mode
      QBO_CLIENT_ID: ${QBO_CLIENT_ID:-}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET:-}
      QBO_REDIRECT_URI: ${QBO_REDIRECT_URI:-}
      QBO_ENV: ${QBO_ENV:-sandbox}
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - apivar:/app/apps/api/var           # documents, exports, email outbox
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports:
      - "${WEB_PORT:-80}:80"               # droplet IP → the app
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  apivar:
