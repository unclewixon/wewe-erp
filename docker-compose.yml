# WEWE ERP — production-shaped stack. See docs/DEPLOYMENT.md for the runbook.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-wewe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-wewe_erp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wewe}"]
      interval: 10s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://${DB_USER:-wewe}:${DB_PASSWORD}@db:5432/${DB_NAME:-wewe_erp}
      PORT: 3001
      COOKIE_SECURE: "1"          # behind TLS; set 0 only for plain-HTTP trials
      CORS_ORIGIN: ${WEB_ORIGIN:-}
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - apivar:/app/apps/api/var  # documents, exports, email outbox
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  apivar:
